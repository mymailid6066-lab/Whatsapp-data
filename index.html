<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scanning...</title>
  <style>
    body {
      background-color: black;
      color: #00ff00;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: inherit;
    }

    .terminal {
      text-align: center;
      font-size: clamp(16px, 4.5vw, 24px);
      line-height: 1.35;
      max-width: 42ch;
      width: 100%;
    }

    .blink {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }

    .progress {
      width: min(300px, 90vw);
      height: 10px;
      border: 1px solid #00ff00;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0;
      background: #00ff00;
      animation: loading 5s linear infinite;
    }

    @keyframes loading {
      0% { width: 0; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div>WhatsApp hacked, scanning chats<span class="blink">...</span></div>
    <div class="progress">
      <div class="bar"></div>
    </div>
  </div>
</body>
</html>
