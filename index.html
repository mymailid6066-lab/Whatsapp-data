<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scanning...</title>
  <style>
    body {
      background-color: black;
      color: #00ff00;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .terminal {
      text-align: center;
      font-size: 24px;
    }

    .blink {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }

    .progress {
      width: 300px;
      height: 10px;
      border: 1px solid #00ff00;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0;
      background: #00ff00;
      animation: loading 5s linear infinite;
    }

    @keyframes loading {
      0% { width: 0; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div>WhatsApp hacked, scanning chats<span class="blink">...</span></div>
    <div class="progress">
      <div class="bar"></div>
    </div>
  </div>
</body>
</html>
